    Writers = {1, 2}
    Appliers = {a1}
    MaxTime = 3
    MaxWrites = 3
    MaxVer = 4
    FixDiscovery = TRUE
    CarryDown = TRUE
    FencedPublish = TRUE
    FixBound = FALSE
    CapRest = TRUE
INVARIANT TypeOK
INVARIANT Correct
INVARIANT TreeFromLogs
CHECK_DEADLOCK FALSE
