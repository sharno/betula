\* GC deletes fences: a delayed put by a fenced writer lands in a deleted slot.
SPECIFICATION Spec
CONSTANTS
    Writers = {1,2}
    MaxSlot = 8
    MaxWrites = 4
    MaxClock = 3
    MaxMver = 7
    KeepFences = FALSE
    FenceOnOpen = TRUE
    TakeMode = "prefix"
    UseLastTs = TRUE
    PutIfAbsent = TRUE
    CheckAfterFence = TRUE
INVARIANT TypeOK
INVARIANT Correct
INVARIANT WriterSees
INVARIANT NoZombieAck
INVARIANT Monotone
CHECK_DEADLOCK FALSE
