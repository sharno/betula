\* Without the cap on tombstone drops: a partial checkpoint takes the older
\* batch (put + del), leaves a later put, drops the del; applying the put
\* later resurrects the key. Bounded by Small, so it finishes in seconds.
SPECIFICATION Spec
CONSTANTS
    Writers = {1, 2}
    Appliers = {a1}
    MaxTime = 4
    MaxWrites = 4
    MaxVer = 3
    FixDiscovery = TRUE
    CarryDown = TRUE
    FencedPublish = TRUE
    FixBound = TRUE
    CapRest = FALSE
INVARIANT TypeOK
INVARIANT Correct
INVARIANT TreeFromLogs
CONSTRAINT Small
CHECK_DEADLOCK FALSE
