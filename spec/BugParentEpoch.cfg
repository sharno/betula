\* Parents name the writer epoch, which two openers on the same base share: two
\* strays look like a chain and GC deletes WAL slots past the latest wal_applied.
SPECIFICATION Spec
CONSTANTS
    Writers = {1, 2, 3}
    MaxSlot = 7
    MaxWrites = 3
    MaxClock = 3
    MaxMver = 7
    KeepFences = TRUE
    FenceOnOpen = TRUE
    TakeMode = "prefix"
    UseLastTs = TRUE
    PutIfAbsent = TRUE
    CheckAfterFence = TRUE
    ConfirmPublish = TRUE
    ParentId = "epoch"
    MaxOpens = 3
INVARIANT TypeOK
INVARIANT Correct
INVARIANT WriterSees
INVARIANT NoZombieAck
INVARIANT Monotone
CHECK_DEADLOCK FALSE
