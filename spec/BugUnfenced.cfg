\* Two appliers without put-if-absent: a stale applier overwrites newer work.
\* Two appliers race on the same manifest; put-if-absent on the next version
\* must keep a stale one from publishing.
SPECIFICATION Spec
CONSTANTS
    Writers = {1, 2}
    Appliers = {a1, a2}
    MaxTime = 3
    MaxWrites = 2
    MaxVer = 3
    FixDiscovery = TRUE
    CarryDown = TRUE
    FencedPublish = FALSE
    FixBound = TRUE
    CapRest = TRUE
INVARIANT TypeOK
INVARIANT Correct
INVARIANT TreeFromLogs
CHECK_DEADLOCK FALSE
